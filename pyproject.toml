[project]
name = "book-agents"
version = "0.1.0"
description = "Event-driven multi-agent system to write coherent books."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "structlog>=24.2.0",
  "gradio>=4.0.0",
]

[project.scripts]
book-agents = "book_agents.cli:app"

[tool.setuptools]
packages = ["book_agents"]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"
